<!DOCTYPE html>

<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>labcycle tracker</title>
        <link rel="stylesheet" href="css/style.css">
    </head>
    <body>
        <header>
            <a href="#">CYCLE MANAGER</a>
            <span>|</span>

            <!--navigation-->
            <nav>
                <a href="#" class="active">Dashboard</a>
                <a href="#">Problems</a>
            </nav>
            <!--search-->
            <form>
                <input type="search" placeholder="Search">
                <button type="submit">🔍</button>
            </form>

            <div class="icon">
                <!--notification-->
                <button type="button" aria-label="Notification">🔔</button>
                <!--profile-->
                <button type="button" aria-label="Profile">👤</button>
            </div>
        </header>

        <main>
            <section class="lab-list">
                <h1>C Programming Labs</h1>
                <ul id="lab-list"></ul>
                <p id="empty-message" class="empty-message" hidden>No labs match filters.</p>
            </section>

            <aside class="filters">
                <h2>Filters</h2>
                <fieldset>
                    <legend>Status</legend>
                    <label><input type="checkbox" data-filter="status" value="solved"> Solved</label>
                    <label><input type="checkbox" data-filter="status" value="unsolved"> Unsolved</label>
                </fieldset>

                <fieldset>
                    <legend>Difficulty</legend>
                    <label><input type="checkbox" data-filter="difficulty" value="easy"> Easy</label>
                    <label><input type="checkbox" data-filter="difficulty" value="medium"> Medium</label>
                    <label><input type="checkbox" data-filter="difficulty" value="hard"> Hard</label>
                </fieldset>
            </aside>
        </main>
        <script src="js/labs.js" defer></script>
        <script src="js/app.js" defer></script>
    </body>
</html>
